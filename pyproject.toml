[project]
name = "escooter-rebalancing"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "pyarrow>=26.0.0",
    "pytest>=9.1.1",
    "requests>=2.34.2",
    "scipy>=1.17.1",
]

[project.scripts]
escooter-rebalancing = "escooter_rebalancing:main"
escooter-clean = "escooter_opt.data.clean:main"
escooter-eda = "escooter_opt.analysis.eda:main"
escooter-transport = "escooter_opt.optimization.transport:main"
escooter-pmedian = "escooter_opt.optimization.pmedian:main"
escooter-scenarios = "escooter_opt.scenarios.runner:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]
